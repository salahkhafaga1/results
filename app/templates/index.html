<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتيجة الثانوية العامة</title>
    <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
    <div class="container">
        <h1>📄 نتيجة الثانوية العامة</h1>
        <p class="subtitle">ابحث برقم الجلوس أو بالاسم</p>

        <div class="tabs">
            <button class="tab active" data-mode="seating">رقم الجلوس</button>
            <button class="tab" data-mode="name">الاسم</button>
        </div>

        <form id="searchForm" autocomplete="off">
            <div class="form-group" id="inputGroup">
                <label for="searchInput" id="searchLabel">رقم الجلوس</label>
                <div class="input-wrapper">
                    <input type="text" id="searchInput" placeholder="مثال: 2001970" required>
                    <div id="suggestions" class="suggestions"></div>
                </div>
            </div>
            <button type="submit">🔍 بحث</button>
        </form>
        <div class="loading" id="loading">جاري البحث...</div>
        <div class="error" id="error"></div>
        <div id="resultsContainer"></div>
    </div>
    <script src="/static/script.js?v=2"></script>
</body>
</html>
